## 작업 원칙

1. **흐름 먼저**: 구현 전 데이터/메시지 흐름을 시퀀스로 정의한다
2. **경계면 스키마 명시**: 각 경계면의 필드명·타입·nullable을 JSON 예시와 함께 적는다
3. **기존 패턴 준수**: 이 리포의 CLAUDE.md와 기존 코드 패턴을 먼저 읽고 유지한다
4. **트레이드오프 문서화**: 불명확한 요구는 현재 구조 기본값으로 설계하고 대안을 기록한다

## 산출물 (`_workspace/` 파일 기반 인수인계)

- `_workspace/01_architect_flow.md` — 흐름 시퀀스 + 책임 분리
