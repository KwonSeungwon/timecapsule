# 캡슐 데이터를 담는 H2 파일이 사는 곳.
# 예전엔 DB_URL 이 jdbc:h2:mem: 이라 파드가 재시작될 때마다 묻어둔 캡슐이
# 전부 사라졌다. 타임캡슐 서비스에서 이건 제품 자체의 부정이다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timecapsule-data
  namespace: timecapsule
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timecapsule-deployment
  namespace: timecapsule
  labels:
    app: timecapsule
spec:
  replicas: 1
  strategy:
    # RWO 볼륨 + 단일 replica — 롤링 업데이트는 새 파드가 볼륨을 못 잡고
    # 두 프로세스가 같은 H2 파일을 열려다 실패한다.
    type: Recreate
  selector:
    matchLabels:
      app: timecapsule
  template:
    metadata:
      labels:
        app: timecapsule
    spec:
      containers:
      - name: timecapsule
        image: timecapsule:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: DB_URL
          # 파일 모드 + PVC. 여기까지만으로는 캡슐이 남지 않는다는 점에 주의 —
          # 데이터가 사라졌던 진짜 원인은 application.properties 의
          # ddl-auto=create 였다(application.yml 을 덮어썼다). 자세한 내용은
          # src/main/resources/application.yml 상단 주석과 PersistenceConfigTest.
          #
          # ⚠️ DB_CLOSE_DELAY=-1 과 DB_CLOSE_ON_EXIT=FALSE 를 같이 쓰지 말 것.
          #    -1 은 "마지막 커넥션이 닫혀도 DB 를 열어둔다", FALSE 는 "JVM 종료
          #    훅으로도 닫지 않는다" 라서 둘을 합치면 DB 가 영영 닫히지 않는다.
          #
          # DB_CLOSE_DELAY=10: 마지막 커넥션이 닫히고 10초 뒤 DB 를 닫는다.
          #    닫힐 때 디스크로 플러시되므로 주기적인 체크포인트가 된다.
          #    0 으로 두면 커넥션이 잠깐 다 반납될 때마다 열고 닫기를 반복한다.
          value: "jdbc:h2:file:/data/timecapsule;DB_CLOSE_DELAY=10;DB_CLOSE_ON_EXIT=TRUE"
        - name: DB_USERNAME
          value: "sa"
        - name: DB_PASSWORD
          value: ""
        # JWT_SECRET 은 없다. 비회원 서비스라 토큰을 발급할 일이 없고,
        # 발급하던 엔드포인트(/api/timecapsule/login)는 인증 없이 서명 토큰을
        # 내주고 있어서 통째로 제거했다. NoMemberEndpointsTest 참고.
        - name: MAIL_HOST
          valueFrom:
            secretKeyRef:
              name: timecapsule-mail-secret
              key: MAIL_HOST
              optional: true
        - name: MAIL_PORT
          valueFrom:
            secretKeyRef:
              name: timecapsule-mail-secret
              key: MAIL_PORT
              optional: true
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: timecapsule-mail-secret
              key: MAIL_USERNAME
              optional: true
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: timecapsule-mail-secret
              key: MAIL_PASSWORD
              optional: true
        - name: MAIL_FROM
          valueFrom:
            secretKeyRef:
              name: timecapsule-mail-secret
              key: MAIL_FROM
              optional: true
        - name: MAIL_SMTP_AUTH
          valueFrom:
            secretKeyRef:
              name: timecapsule-mail-secret
              key: MAIL_SMTP_AUTH
              optional: true
        - name: MAIL_SMTP_STARTTLS_ENABLE
          valueFrom:
            secretKeyRef:
              name: timecapsule-mail-secret
              key: MAIL_SMTP_STARTTLS_ENABLE
              optional: true
        volumeMounts:
        - name: data
          mountPath: /data
        # health 에서 mail 인디케이터는 꺼져 있다(application.yml).
        # SMTP 도달성으로 readiness 를 판정하면 메일 장애가 곧 사이트 전체 다운이 된다.
        readinessProbe:
          httpGet: { path: /actuator/health/readiness, port: 3000 }
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet: { path: /actuator/health/liveness, port: 3000 }
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests: { cpu: 100m, memory: 384Mi }
          limits:   { cpu: "1",  memory: 768Mi }
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: timecapsule-data
---
apiVersion: v1
kind: Service
metadata:
  name: timecapsule-service
  namespace: timecapsule
spec:
  type: ClusterIP
  selector:
    app: timecapsule
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timecapsule-ingress
  namespace: timecapsule
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: timecapsule.chatflow.ai.kr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: timecapsule-service
            port:
              number: 80
