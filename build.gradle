plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'war'
}

group = 'com.mini'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // QueryDSL Jakarta 대응
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // DB
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Utils
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Dockerfile 이 build/libs/*.war 를 글롭으로 집어간다. war 플러그인이 만드는
// -plain.war 까지 남아 있으면 `./gradlew build` 후 두 개가 매치돼서
// COPY 가 실패하거나 엉뚱한(스프링 부트 런처가 없는) WAR 가 실려 나간다.
// 배포에 쓰는 건 bootWar 하나뿐이라 plain 쪽은 끈다.
tasks.named('war') {
    enabled = false
}

// Vue 빌드 연동 설정
def vueDir = "$projectDir/vue"

def vueStaticDir = "$projectDir/src/main/resources/static"

task buildVue(type: Exec) {
    workingDir vueDir
    group = 'build'

    // inputs 를 vueDir 통째로 잡지 말 것 — vue/node_modules 까지 매번 핑거프린팅한다.
    // 게다가 outputs 가 없으면 Gradle 이 up-to-date 판정을 할 수 없어서
    // test / bootRun / build / bootWar 를 돌릴 때마다 webpack 풀빌드가 다시 돈다.
    inputs.dir "$vueDir/src"
    inputs.dir "$vueDir/public"
    inputs.files "$vueDir/package.json", "$vueDir/package-lock.json",
            "$vueDir/vue.config.js", "$vueDir/babel.config.js"
    outputs.dir vueStaticDir
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine "npm.cmd", "run", "build"
    } else {
        commandLine "npm", "run", "build"
    }
}

// ⚠️ 여기에 vue/dist → static 복사 태스크를 만들지 말 것. 두 번 그랬다가 두 번 다 틀렸다.
//
// vue/vue.config.js 의 outputDir 이 이미 ../src/main/resources/static 을 가리킨다.
// 즉 npm run build 가 **최종 위치에 직접** 쓴다. vue/dist 는 애초에 생기지 않는다.
// 그래서 from "$vueDir/dist" 로 만든 Copy 태스크는 항상 0개를 복사하는 no-op 이고,
// 거기에 "옛 해시 번들 청소" 명목으로 doFirst { delete static } 을 붙이면
// 방금 buildVue 가 만들어낸 산출물을 지운 뒤 아무것도 복사하지 않는다
// → 프론트엔드가 통째로 빠진 WAR 가 나간다.
//   (예전 주석은 "-x 로 태스크를 건너뛰던 배포 경로에서만 안 터져서 안 들켰다"고
//    적어 뒀는데 사실이 아니다 — 리포의 -x buildVue 는 plans 문서의 ./gradlew test
//    에만 붙어 있고 배포 경로에는 없다. 왜 늦게 발견됐는지는 확인된 바 없다.)
//
// 옛 번들 누적도 실재하지 않는 문제다 — vue-cli-service build 는 outputDir 을
// 기본으로 비우고 시작한다(--no-clean 을 줘야 안 비운다). 검증함: static/js 에
// app.DEADBEEF.js 를 심어두고 빌드하면 사라진다.
//
// 따라서 필요한 건 "복사"가 아니라 "순서 보장"뿐이다.
processResources {
    dependsOn buildVue
}

// QueryDSL QClass 생성 경로 설정 (Spring Boot 3 방식)
def querydslSrcDir = 'src/main/generated'

// 참고: 아래 clean 은 static(=buildVue 산출물)을 지우지 않는다. 의도한 것이다.
// "clean 인데 왜 안 지우지" 싶어 clean { delete file(vueStaticDir) } 를 붙이고 싶어지는데,
// 고쳐지는 건 없고 매번 느려지기만 한다.
// 실측(scripts/deploy-k3s.sh / docs/DEPLOYMENT.md 가 쓰는 `./gradlew clean bootWar --no-daemon`):
//   clean 후 static 에 파일이 그대로 남고 :buildVue 는 UP-TO-DATE 로 스킵되지만,
//   그 남은 산출물이 곧 최신 산출물이라 WAR 에는 static 이 정상적으로 들어간다.
// delete 를 걸어도 WAR 가 깨지지는 않는다 — Gradle 은 inputs 뿐 아니라 outputs 도
// 핑거프린팅해서, 산출물을 지우거나 고치면 :buildVue 가 다시 돈다
// (실측: static 을 rm -rf 한 뒤 bootWar → :buildVue 재실행 / 산출물 1개만 수정해도 재실행).
// 대신 clean 할 때마다 webpack 풀빌드가 강제된다. 그래서 안 건다.
//
// 진짜 위험한 건 clean 이 아니라 **buildVue 뒤에 static 을 지우는** 태스크다
// (위 processResources 주석의 "프론트엔드가 통째로 빠진 WAR" 사고가 그 경우).
// 참고로 outputs 추적은 "Gradle 이 기록해 둔 산출물"만 본다 — static 에 낯선 파일을
// 새로 끼워 넣는 건 감지하지 않는다(실측: app.DEADBEEF.js 를 심어도 UP-TO-DATE).
clean {
    delete file(querydslSrcDir)
}

tasks.withType(JavaCompile) {
    options.generatedSourceOutputDirectory = file(querydslSrcDir)
}
