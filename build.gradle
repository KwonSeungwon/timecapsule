plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'war'
}

group = 'com.mini'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // QueryDSL Jakarta 대응
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // DB
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Utils
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Vue 빌드 연동 설정
def vueDir = "$projectDir/vue"

task buildVue(type: Exec) {
    workingDir vueDir
    inputs.dir vueDir
    group = 'build'
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine "npm.cmd", "run", "build"
    } else {
        commandLine "npm", "run", "build"
    }
}

// ⚠️ 여기에 vue/dist → static 복사 태스크를 만들지 말 것. 두 번 그랬다가 두 번 다 틀렸다.
//
// vue/vue.config.js 의 outputDir 이 이미 ../src/main/resources/static 을 가리킨다.
// 즉 npm run build 가 **최종 위치에 직접** 쓴다. vue/dist 는 애초에 생기지 않는다.
// 그래서 from "$vueDir/dist" 로 만든 Copy 태스크는 항상 0개를 복사하는 no-op 이고,
// 거기에 "옛 해시 번들 청소" 명목으로 doFirst { delete static } 을 붙이면
// 방금 buildVue 가 만들어낸 산출물을 지운 뒤 아무것도 복사하지 않는다
// → 프론트엔드가 통째로 빠진 WAR 가 나간다. (-x 플래그로 태스크를 건너뛰던
//   배포 경로에서만 안 터져서 한동안 안 들켰다.)
//
// 옛 번들 누적도 실재하지 않는 문제다 — vue-cli-service build 는 outputDir 을
// 기본으로 비우고 시작한다(--no-clean 을 줘야 안 비운다). 검증함: static/js 에
// app.DEADBEEF.js 를 심어두고 빌드하면 사라진다.
//
// 따라서 필요한 건 "복사"가 아니라 "순서 보장"뿐이다.
processResources {
    dependsOn buildVue
}

// QueryDSL QClass 생성 경로 설정 (Spring Boot 3 방식)
def querydslSrcDir = 'src/main/generated'

clean {
    delete file(querydslSrcDir)
}

tasks.withType(JavaCompile) {
    options.generatedSourceOutputDirectory = file(querydslSrcDir)
}
