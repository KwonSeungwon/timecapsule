plugins {
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'war'
}

group = 'com.mini'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // QueryDSL Jakarta 대응
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // DB
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Utils
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Vue 빌드 연동 설정
def vueDir = "$projectDir/vue"

task buildVue(type: Exec) {
    workingDir vueDir
    inputs.dir vueDir
    group = 'build'
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        commandLine "npm.cmd", "run", "build"
    } else {
        commandLine "npm", "run", "build"
    }
}

// vue-cli 는 번들 파일명에 콘텐츠 해시를 박는다(app.2bf204c7.js). 그래서 그냥 복사만
// 하면 이전 빌드의 app.<옛해시>.js 가 static 아래에 영원히 남고, 그대로 WAR 에 실려
// 나간다. static 은 gitignore 대상이라 눈에도 안 띄고, 아무도 참조하지 않는 옛 번들이
// 배포 산출물에 계속 쌓인다 — 소스맵까지 같이 쌓이므로 증가 속도도 빠르다.
// 매번 비우고 채우는 게 유일하게 안전한 방법이다(dist 가 곧 완전한 산출물이다).
task copyVueBuildFiles(type: Copy) {
    dependsOn buildVue
    from "$vueDir/dist"
    into "$projectDir/src/main/resources/static"
    doFirst {
        delete "$projectDir/src/main/resources/static"
    }
}

processResources {
    dependsOn copyVueBuildFiles
}

// QueryDSL QClass 생성 경로 설정 (Spring Boot 3 방식)
def querydslSrcDir = 'src/main/generated'

clean {
    delete file(querydslSrcDir)
}

tasks.withType(JavaCompile) {
    options.generatedSourceOutputDirectory = file(querydslSrcDir)
}
